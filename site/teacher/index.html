<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>정보 수업 자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16202c;--muted:#5b6776;--paper:#f3efe7;--line:#e3ddd2;--navy:#0f2742;--amber:#f2a516}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
  header{background:var(--navy);color:#fff;padding:20px 16px 16px}
  .wrap{max-width:1100px;margin:0 auto}
  header h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.9rem;margin:0}
  header p{margin:6px 0 0;color:#c8d6e8;font-size:.92rem}
  .top{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .top a{color:var(--navy);background:var(--amber);border-radius:10px;padding:6px 12px;text-decoration:none;font-weight:700;font-size:.92rem}
  main{padding:16px 16px 60px}
  .tg{font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin:4px 0 0}
  .unit{margin:24px 0 8px;display:flex;align-items:center;gap:10px}
  .unit h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.4rem;margin:0;color:var(--k)}
  .unit .cnt{color:var(--muted);font-size:.85rem}
  .les{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(15,39,66,.06);padding:10px 12px;margin-bottom:7px;border-left:6px solid var(--k)}
  .les.todo{opacity:.5;border-left-style:dashed}
  .no{font-family:"Black Han Sans",sans-serif;font-size:1.2rem;color:var(--k)}
  .les h3{margin:0;font-size:1rem}
  .les small{color:var(--muted);font-size:.8rem}
  .st{display:inline-block;font-size:.72rem;border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
  .st.ready{background:#e3f4ec;color:#17694f}.st.draft{background:#fff4d6;color:#8a5a00}.st.todo{background:#eef0f3;color:#5b6776}
  .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .act a,.act button{font:inherit;font-size:.82rem;border:1.5px solid var(--k);background:#fff;color:var(--ink);border-radius:9px;padding:3px 9px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .act a:hover,.act button:hover{background:color-mix(in srgb,var(--k) 12%,white)}
  @media (max-width:640px){.les{grid-template-columns:48px 1fr}.act{grid-column:1/-1;justify-content:flex-start}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>정보 수업 자료</h1>
  <p>선생님용 목록입니다. 「열기」는 미리보기(전송 안 함)로 열리고, 📋은 학생에게 줄 주소를 복사합니다.</p>
  <div class="top"><a href="progress/">📈 진도 현황</a><span id="assess"></span></div>
  <label class="tg"><input type="checkbox" id="showTodo"> 아직 만들지 않은 차시도 보기</label>
</div></header>
<main><div class="wrap" id="list"></div></main>
<div class="toast" id="toast"></div>
<script>
const UNITS=[{"name": "Ⅰ. 컴퓨팅 시스템", "color": "#2f6fd0", "lessons": [{"no": "01", "id": "u1-network", "title": "네트워크의 특성", "pages": "8~17", "form": "info-u1-network", "status": "ready"}, {"no": "02", "id": "u1-network-sharing", "title": "네트워크를 사용한 공유 · 네트워크 정리", "pages": "18~23", "form": "info-u1-network-sharing", "status": "ready"}, {"no": "03", "id": "u1-iot-system", "title": "사물 인터넷 시스템의 구성과 동작", "pages": "24~29", "form": "info-u1-iot-system", "status": "ready"}, {"no": "04", "id": "u1-iot-change", "title": "사물 인터넷 기술로 인한 변화", "pages": "30~33", "form": "info-u1-iot-change", "status": "ready"}, {"no": "05", "id": "u1-iot-design-1", "title": "사물 인터넷 시스템 설계 ① 장치 고르기와 연결", "pages": "34~37", "form": "info-u1-iot-design-1", "status": "ready"}, {"no": "06", "id": "u1-iot-design-2", "title": "사물 인터넷 시스템 설계 ② 스마트 조명 만들기 · 사물 인터넷 정리", "pages": "37~41", "form": "info-u1-iot-design-2", "status": "ready"}, {"no": "07", "id": "u1-review", "title": "협력적 창의·융합 프로젝트 · Ⅰ단원 정리", "pages": "42~45", "form": "info-u1-review", "status": "ready"}]}, {"name": "Ⅱ. 데이터", "color": "#1f9d74", "lessons": [{"no": "08", "id": "u2-compression", "title": "디지털 데이터의 압축", "pages": "48~57", "form": "info-u2-compression", "status": "todo"}, {"no": "09", "id": "u2-encryption", "title": "디지털 데이터의 암호화 · 압축과 암호화 정리", "pages": "58~65", "form": "info-u2-encryption", "status": "todo"}, {"no": "10", "id": "u2-bigdata-collect", "title": "빅데이터 수집", "pages": "66~69", "form": "info-u2-bigdata-collect", "status": "todo"}, {"no": "11", "id": "u2-preprocess", "title": "빅데이터 전처리", "pages": "70~75", "form": "info-u2-preprocess", "status": "todo"}, {"no": "12", "id": "u2-visualize", "title": "빅데이터 시각화 · 빅데이터 정리", "pages": "76~83", "form": "info-u2-visualize", "status": "todo"}, {"no": "13", "id": "u2-review", "title": "협력적 창의·융합 프로젝트 · Ⅱ단원 정리", "pages": "84~87", "form": "info-u2-review", "status": "todo"}]}, {"name": "Ⅲ. 알고리즘과 프로그래밍", "color": "#9b4fc4", "lessons": [{"no": "14", "id": "u3-decompose-model", "title": "문제 분해와 모델링", "pages": "90~98", "form": "info-u3-decompose-model", "status": "todo"}, {"no": "15", "id": "u3-algorithm-efficiency", "title": "알고리즘 설계와 성능 평가", "pages": "99~101", "form": "info-u3-algorithm-efficiency", "status": "todo"}, {"no": "16", "id": "u3-sorting", "title": "정렬 알고리즘", "pages": "102~107", "form": "info-u3-sorting", "status": "todo"}, {"no": "17", "id": "u3-searching", "title": "탐색 알고리즘 · 알고리즘 정리", "pages": "108~117", "form": "info-u3-searching", "status": "todo"}, {"no": "18", "id": "u3-variables", "title": "변수와 자료형", "pages": "118~121", "form": "info-u3-variables", "status": "todo"}, {"no": "19", "id": "u3-io", "title": "표준입출력과 파일입출력", "pages": "122~125", "form": "info-u3-io", "status": "todo"}, {"no": "20", "id": "u3-data-1d", "title": "다차원 데이터 ① 리스트와 딕셔너리", "pages": "126~128", "form": "info-u3-data-1d", "status": "todo"}, {"no": "21", "id": "u3-data-2d", "title": "다차원 데이터 ② 2차원 데이터", "pages": "129~131", "form": "info-u3-data-2d", "status": "todo"}, {"no": "22", "id": "u3-selection", "title": "제어 구조의 응용 ① 선택 구조", "pages": "132~135", "form": "info-u3-selection", "status": "todo"}, {"no": "23", "id": "u3-loop", "title": "제어 구조의 응용 ② 반복 구조", "pages": "136~141", "form": "info-u3-loop", "status": "todo"}, {"no": "24", "id": "u3-function", "title": "제어 구조의 응용 ③ map()·split()과 함수", "pages": "142~145", "form": "info-u3-function", "status": "todo"}, {"no": "25", "id": "u3-class", "title": "객체와 클래스 · 프로그래밍 정리", "pages": "146~153", "form": "info-u3-class", "status": "todo"}, {"no": "26", "id": "u3-review", "title": "협력적 창의·융합 프로젝트 · Ⅲ단원 정리", "pages": "154~159", "form": "info-u3-review", "status": "todo"}]}, {"name": "Ⅳ. 인공지능", "color": "#e0702b", "lessons": [{"no": "27", "id": "u4-agent", "title": "지능 에이전트의 개념과 특성", "pages": "162~169", "form": "info-u4-agent", "status": "todo"}, {"no": "28", "id": "u4-human-ai", "title": "인간과 인공지능의 역할 · 지능 에이전트 정리", "pages": "170~175", "form": "info-u4-human-ai", "status": "todo"}, {"no": "29", "id": "u4-ml-concept", "title": "기계학습의 개념과 유형", "pages": "176~179", "form": "info-u4-ml-concept", "status": "todo"}, {"no": "30", "id": "u4-supervised", "title": "지도학습", "pages": "180~185", "form": "info-u4-supervised", "status": "todo"}, {"no": "31", "id": "u4-unsupervised", "title": "비지도학습", "pages": "186~187", "form": "info-u4-unsupervised", "status": "todo"}, {"no": "32", "id": "u4-ml-apply", "title": "기계학습 활용 · 기계학습 정리", "pages": "188~199", "form": "info-u4-ml-apply", "status": "todo"}, {"no": "33", "id": "u4-review", "title": "협력적 창의·융합 프로젝트 · Ⅳ단원 정리", "pages": "200~205", "form": "info-u4-review", "status": "todo"}]}, {"name": "Ⅴ. 디지털 문화", "color": "#d64535", "lessons": [{"no": "34", "id": "u5-digital-impact", "title": "디지털 기술의 영향", "pages": "208~215", "form": "info-u5-digital-impact", "status": "todo"}, {"no": "35", "id": "u5-digital-career", "title": "디지털 사회의 진로 · 디지털 기술과 사회 변화 정리", "pages": "216~221", "form": "info-u5-digital-career", "status": "todo"}, {"no": "36", "id": "u5-info-protection", "title": "정보 보호와 정보 공유", "pages": "222~227", "form": "info-u5-info-protection", "status": "todo"}, {"no": "37", "id": "u5-info-security", "title": "정보 보안 · 정보 보호와 보안 정리", "pages": "228~233", "form": "info-u5-info-security", "status": "todo"}, {"no": "38", "id": "u5-review", "title": "협력적 창의·융합 프로젝트 · Ⅴ단원 정리", "pages": "234~237", "form": "info-u5-review", "status": "todo"}]}], SITE='https://dsinfoclass.vercel.app/', ASSESS=[];
document.getElementById('assess').innerHTML=ASSESS.map(a=>`<a href="../${a.path}" target="_blank" rel="noopener" title="${a.note||''}">📋 수행평가 · ${a.title}</a><button data-u="${SITE}${a.path}" style="margin-left:4px">📋 주소</button>`).join(' ');
const ST={ready:'공개',draft:'만드는 중',todo:'아직 없음'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
  const all=document.getElementById('showTodo').checked;
  document.getElementById('list').innerHTML=UNITS.map(u=>{
    const L=u.lessons.filter(l=>all||l.status!=='todo');
    if(!L.length) return '';
    return `<div class="unit" style="--k:${u.color}"><h2>${esc(u.name)}</h2><span class="cnt">${u.lessons.filter(l=>l.status==='ready').length} / ${u.lessons.length} 공개</span></div>`+
      L.map(l=>{const url=SITE+l.id+'/', has=l.status!=='todo';
        return `<div class="les ${l.status}" style="--k:${u.color}"><div class="no">${esc(l.no)}</div>
        <div><h3>${esc(l.title)}<span class="st ${l.status}">${ST[l.status]}</span></h3><small>${esc(l.pages)}쪽 · ${esc(l.id)}</small></div>
        <div class="act">${has?`<a href="../${l.id}/?preview" target="_blank" rel="noopener">열기</a><button data-u="${esc(url)}">📋 학생 주소</button>`:''}${has&&l.form?`<a href="../forms/${esc(l.form)}.html?preview" target="_blank" rel="noopener">질문폼</a>`:''}</div></div>`;}).join('');
  }).join('');
}
document.getElementById('showTodo').onchange=draw; draw();
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-u]'); if(!b) return;
  try{await navigator.clipboard.writeText(b.dataset.u); toast('학생 주소를 복사했어요');}catch(x){prompt('주소를 복사하세요',b.dataset.u);}});
function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1500);}
</script>
</body>
</html>
